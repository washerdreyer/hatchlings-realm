<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hatchling Realms">
<meta name="theme-color" content="#0f3b63">
<title>Hatchling Realms</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one centered column per screen over a realm scene; big touch targets for iPad. */
:root{--ink:#fff;--soft:rgba(255,255,255,.8);--card:rgba(12,18,48,.55);--card2:rgba(255,255,255,.14);--line:rgba(255,255,255,.3);--good:#7ce3a1;--oops:#ffb4a2;--gold:#ffd166;--navy:#0b1b3a;--sky1:#0f3b63;--sky2:#3aa6c9;--accent:#7fe3ff;--display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif;color-scheme:dark}
#app[data-realm="1"]{--sky1:#3b2a1f;--sky2:#a8793f;--accent:#ffd27a}
#app[data-realm="2"]{--sky1:#3a0d12;--sky2:#d9552a;--accent:#ffb35c}
#app[data-realm="3"]{--sky1:#2f2d6e;--sky2:#8fb0ee;--accent:#f1eeff}
html,body{height:100%}
body{margin:0;background:#0f3b63;color:var(--ink);font-family:var(--body);font-weight:600;font-size:17px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{min-height:100%;position:relative;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2))}
.scene{position:absolute;left:0;right:0;bottom:0;height:40%;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
.wrap{position:relative;max-width:760px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1[data-hold]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
h1,.title{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3rem);line-height:1.05;margin:6px 0 0;text-align:center;text-wrap:balance}
.title.sm{font-size:1.8rem}
.sub{color:var(--soft);margin:2px 0 0;text-align:center}
.top .sub{text-align:left}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.who{font-family:var(--display);font-size:1.5rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.95rem}
.ic{width:18px;height:18px}
.btn{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--navy);background:var(--accent);border:0;border-radius:18px;padding:12px 20px;min-height:56px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.ghost{background:var(--card2);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{min-height:44px;font-size:1rem;padding:8px 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pick{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;min-height:190px;justify-content:center}
.pick b{font-family:var(--display);font-size:1.4rem}
.plus{font-size:3rem;line-height:1;font-family:var(--display)}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px}
.pet{animation:bob 3.2s ease-in-out infinite}
.bubble{background:#fff;color:var(--navy);border-radius:18px;padding:10px 16px;max-width:30ch;text-align:center;font-weight:800}
.bar{height:14px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.xpline{display:flex;justify-content:space-between;font-size:.9rem;color:var(--soft);margin-top:4px}
.quests{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.quest{font:inherit;color:var(--ink);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.quest b{font-family:var(--display);font-size:1.3rem}
.quest span{color:var(--soft);font-size:.95rem}
.quest[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-weight:800;margin-top:6px}
input{font:inherit;font-weight:800;font-size:1.4rem;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.95);color:var(--navy);padding:10px 14px;min-height:52px;width:100%;box-sizing:border-box}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{font:inherit;font-family:var(--display);font-size:1.2rem;color:var(--ink);background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:8px 16px;min-height:48px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--navy);border-color:#fff}
.chip.egg{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 10px}
.dots{display:flex;gap:6px}
.d{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)}
.d.on{background:var(--gold)}.d.cur{outline:2px solid #fff}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
.qcard{width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px}
.q{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,10vw,4rem);text-align:center}
.ansbox{min-width:140px;min-height:64px;text-align:center;font-family:var(--display);font-size:2.6rem;background:rgba(255,255,255,.95);color:var(--navy);border-radius:16px;padding:2px 18px}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px}
.pad .btn{padding:6px;font-size:1.6rem}
.clock{width:190px;max-width:60vw}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts .btn{font-size:1.6rem}
.blanks{font-family:var(--display);font-size:2.2rem;letter-spacing:.2em;min-height:44px}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:62px}
.slot{width:46px;height:58px;border-bottom:4px solid var(--line);display:flex;align-items:flex-end;justify-content:center}
.tile{font-family:var(--display);font-weight:800;font-size:1.8rem;min-width:52px;height:56px;border-radius:14px;border:0;background:var(--accent);color:var(--navy);box-shadow:0 4px 0 rgba(0,0,0,.3);cursor:pointer}
.tile.gone{visibility:hidden}
.fb{width:100%;box-sizing:border-box;border-radius:16px;padding:12px 16px;text-align:center;font-weight:800;color:var(--navy)}
.fb.good{background:var(--good)}.fb.oops{background:var(--oops)}
.fb .big{font-family:var(--display);font-size:2rem;letter-spacing:.12em;display:block}
.bad{color:#b3261e;text-decoration:underline}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:44px;height:44px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{background:var(--card2);border-radius:12px;padding:10px 14px;font-weight:800}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.badge{border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.badge b{display:block;font-family:var(--display)}
.badge span{font-size:.85rem;color:var(--soft)}
.badge.off{opacity:.45}
.shop{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:6px 0}
.test{border:2px dashed var(--accent)}
.cf{position:fixed;top:-14px;width:10px;height:14px;z-index:50;pointer-events:none;animation:fall 1.5s ease-in forwards}
.foes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.foe{font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.foe b{font-family:var(--display);font-size:1.25rem}
.foe small,.side small{color:var(--soft);font-weight:800}
.tag{display:inline-block;border-radius:99px;padding:2px 12px;font-weight:800;font-size:.85rem;background:var(--card2);border:1px solid var(--line)}
.tag.easy{background:var(--good);color:var(--navy)}.tag.even{background:var(--gold);color:var(--navy)}.tag.hard{background:var(--oops);color:var(--navy)}.tag.no{background:#ff6b6b;color:#fff}
.hp{height:16px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;width:100%}
.hp i{display:block;height:100%;background:var(--good);border-radius:9px;transition:width .4s}
.hp.foehp i{background:#ff8a80}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:420px}
.arena{display:flex;flex-direction:column;align-items:center;gap:10px}
.abils{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.abil{min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:8px}
.abil small{font-family:var(--body);font-size:.8rem;font-weight:800;opacity:.85}
.warn{background:var(--gold);color:var(--navy);border-radius:14px;padding:8px 14px;font-weight:800;text-align:center}
.gate{border:2px solid var(--gold)}
.shake{animation:wob .45s}
.passage{background:rgba(255,255,255,.95);color:var(--navy);border-radius:16px;padding:14px 18px;font-size:1.15rem;line-height:1.55;font-weight:700;max-width:62ch;width:100%;box-sizing:border-box}
.prompt{font-family:var(--display);font-weight:800;font-size:1.5rem;text-align:center;text-wrap:balance}
.seq{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.slotq{width:56px;height:56px;border:3px dashed var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.8rem}
.opts.txt .btn{font-size:1.15rem;font-weight:700;font-family:var(--body);min-height:64px;line-height:1.2}
.opts.col1{grid-template-columns:1fr}
.fb svg{vertical-align:middle}
.cheer{animation:hop .6s}.wobble{animation:wob .5s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{30%{transform:translateY(-22px) scale(1.05)}}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- game data and logic (no DOM) ---------- */
var KEY='hatchling-realms-v1';
var TYPES={ember:{name:'Ember',c1:'#ff8a3d',c2:'#ffc78a',dk:'#a8391a'},tide:{name:'Tide',c1:'#3ea6e8',c2:'#9fe6ff',dk:'#17609e'},stone:{name:'Stone',c1:'#a08258',c2:'#e3c88d',dk:'#5a4226'},gust:{name:'Gust',c1:'#a99bf0',c2:'#e9e4ff',dk:'#5b4bbd'}};
var REALMS=[{n:'Tide Pools'},{n:'Crystal Canyon'},{n:'Ember Peak'},{n:'Cloud Isles'}];
var TITLES=['Cadet','Scout','Ranger','Captain','Commander'];
var ACC={crown:{n:'Star Crown',cost:6},scarf:{n:'Red Scarf',cost:10},glasses:{n:'Round Glasses',cost:14}};
var MAXL={math:16,spell:8,miss:8,clock:4,vocab:8,logic:8};
var MATH_TOPICS=['Add to 10','Add and subtract to 20','Add and subtract to 100','Times 2, 5, 10','Times tables','Big add and subtract','Division','2-digit × 1-digit','2-digit × 2-digit','Long division','Powers and roots','Percentages','Decimals','Fractions','Equations','Harder equations'];
var START={1:{math:1,spell:1,miss:1,clock:1,vocab:1,logic:1},2:{math:2,spell:2,miss:2,clock:2,vocab:2,logic:2},3:{math:4,spell:3,miss:3,clock:3,vocab:3,logic:3},4:{math:7,spell:4,miss:6,clock:4,vocab:5,logic:5}};
var WORDS={
1:['cat','dog','sun','hat','bed','pig','red','cup','map','bus','fox','pen'],
2:['frog','jump','milk','tree','fish','star','rain','book','ship','cake','moon','bird'],
3:['apple','happy','water','green','house','plant','smile','train','eight','sleep','cloud','tiger'],
4:['because','friend','school','people','garden','orange','mother','spring','planet','bridge','window','animal'],
5:['library','science','journey','weather','through','thought','morning','machine','kitchen','mountain','strange','pattern'],
6:['beautiful','different','favorite','language','question','surprise','calendar','exercise','separate','adventure','knowledge','important'],
7:['necessary','restaurant','vegetable','government','environment','temperature','neighbor','interesting','experience','dangerous'],
8:['embarrass','conscience','occasionally','rhythm','privilege','accommodate','definitely','guarantee','committee','perseverance']};

function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function levelOf(xp){return Math.floor(Math.sqrt(xp/20))+1;}
function xpFor(L){return 20*(L-1)*(L-1);}
function stageOf(xp){var L=levelOf(xp);return xp<30?0:L<4?1:L<8?2:3;}
function realmOf(xp){return Math.min(3,Math.floor((levelOf(xp)-1)/3));}
function titleOf(xp){return TITLES[Math.min(4,Math.floor((levelOf(xp)-1)/2))];}

function calc(a,op,b){return op==='+'?a+b:op==='-'?a-b:op==='×'?a*b:a/b;}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
function sup(n){return String(n).split('').map(function(d){return '⁰¹²³⁴⁵⁶⁷⁸⁹'.charAt(+d);}).join('');}
function sgn(n){return n<0?'− '+(-n):'+ '+n;}
function fr(n,d){var g=gcd(n,d);n/=g;d/=g;return {s:d===1?String(n):n+'/'+d,v:n/d};}
function trimNum(x,dp){return String(+x.toFixed(dp));}
function parseAns(s){
  s=String(s).trim();var m=s.match(/^(-?\d+)\/(\d+)$/);
  if(m)return +m[2]===0?NaN:(+m[1])/(+m[2]);
  return /^-?(\d+\.?\d*|\.\d+)$/.test(s)?Number(s):NaN;
}
function close(v,ans){return !isNaN(v)&&Math.abs(v-ans)<1e-6;}
function hardQ(l){
  var q={note:''},a,b,c,d,x,t,f;
  if(l===9){a=ri(12,49);b=ri(11,29);q.text=a+' × '+b+' = ?';q.ans=a*b;}
  else if(l===10){b=ri(3,19);c=ri(12,60);q.text=(b*c)+' ÷ '+b+' = ?';q.ans=c;}
  else if(l===11){t=ri(1,4);
    if(t===1){a=ri(2,15);q.text=a+'² = ?';q.ans=a*a;}
    else if(t===2){a=ri(2,6);q.text=a+'³ = ?';q.ans=a*a*a;}
    else if(t===3){a=ri(2,10);q.text='2'+sup(a)+' = ?';q.ans=Math.pow(2,a);}
    else{a=ri(2,15);q.text='√'+(a*a)+' = ?';q.ans=a;}}
  else if(l===12){a=pick([5,10,15,20,25,30,40,50,75]);t=ri(1,3);b=ri(1,12)*(100/gcd(a,100));
    if(t===1){q.text=a+'% of '+b+' = ?';q.ans=a*b/100;}
    else if(t===2){q.text=(a*b/100)+' is what percent of '+b+'?';q.ans=a;q.note='Answer as a number, like 25';}
    else{q.text='Price '+b+', '+a+'% off. New price?';q.ans=b-a*b/100;}}
  else if(l===13){t=ri(1,4);
    if(t===1){a=ri(11,99);b=ri(11,99);q.text=(a/10).toFixed(1)+' + '+(b/10).toFixed(1)+' = ?';q.ans=(a+b)/10;}
    else if(t===2){a=ri(300,999);b=ri(110,a-1);q.text=(a/100).toFixed(2)+' − '+(b/100).toFixed(2)+' = ?';q.ans=(a-b)/100;}
    else if(t===3){a=ri(11,99);c=ri(2,9);q.text=(a/10).toFixed(1)+' × '+c+' = ?';q.ans=a*c/10;}
    else{a=ri(11,99);c=ri(2,9);q.text=(a*c/10).toFixed(1)+' ÷ '+c+' = ?';q.ans=a/10;}
    q.note='Use a decimal point';}
  else if(l===14){
    do{
      t=ri(1,3);b=pick([2,3,4,5,6]);d=pick([2,3,4,6,8,10,12]);a=ri(1,b-1);c=ri(1,d-1);
      if(t===1){f=fr(a*d+c*b,b*d);q.text=a+'/'+b+' + '+c+'/'+d+' = ?';}
      else if(t===2){if(a*d<c*b){var tn=a,td=b;a=c;b=d;c=tn;d=td;}f=fr(a*d-c*b,b*d);q.text=a+'/'+b+' − '+c+'/'+d+' = ?';}
      else{f=fr(a*c,b*d);q.text=a+'/'+b+' × '+c+'/'+d+' = ?';}
    }while(f.v===0);
    q.ans=f.v;q.disp=f.s;q.note='Answer as a fraction, like 7/8';}
  else if(l===15){t=ri(1,3);x=ri(2,12);
    if(t===1){a=ri(2,9);b=ri(1,20);q.text=a+'x + '+b+' = '+(a*x+b);}
    else if(t===2){a=ri(2,9);b=ri(1,Math.min(15,a*x-1));q.text=a+'x − '+b+' = '+(a*x-b);}
    else{a=ri(2,6);x=a*ri(2,10);b=ri(1,12);q.text='x/'+a+' + '+b+' = '+(x/a+b);}
    q.ans=x;q.note='Solve for x';}
  else{t=ri(1,2);
    if(t===1){
      do{a=ri(3,9);c=ri(1,a-1);x=ri(-8,12);if(x===0)x=5;b=ri(-12,12);if(b===0)b=4;d=b+(a-c)*x;}while(d===0);
      q.text=a+'x '+sgn(b)+' = '+(c===1?'':c)+'x '+sgn(d);}
    else{a=ri(2,9);b=ri(1,9);x=ri(-5,10);q.text=a+'(x '+sgn(b)+') = '+(a*(x+b));}
    q.ans=x;q.note='Solve for x. The − key makes a negative.';}
  if(q.disp===undefined)q.disp=trimNum(+q.ans,4);
  return q;
}
function mathQ(l){
  if(l>8)return hardQ(l);
  var a,b,op,q;
  if(l===1){a=ri(1,9);b=ri(1,10-a);op='+';}
  else if(l===2){if(Math.random()<.5){a=ri(3,12);b=ri(2,20-a);op='+';}else{a=ri(8,20);b=ri(1,a-1);op='-';}}
  else if(l===3){if(Math.random()<.5){a=ri(10,60);b=ri(5,99-a);op='+';}else{a=ri(20,99);b=ri(5,a-1);op='-';}}
  else if(l===4){a=pick([2,5,10]);b=ri(1,10);op='×';}
  else if(l===5){a=ri(2,10);b=ri(2,10);op='×';}
  else if(l===6){if(Math.random()<.5){a=ri(100,800);b=ri(50,999-a);op='+';}else{a=ri(200,999);b=ri(50,a-1);op='-';}}
  else if(l===7){b=ri(2,10);q=ri(2,10);a=b*q;op='÷';}
  else{a=ri(12,99);b=ri(3,9);op='×';}
  var ans=calc(a,op,b);
  return {a:a,b:b,op:op,ans:ans,text:a+' '+op+' '+b+' = ?'};
}
function missingQ(l){
  var q=mathQ(Math.min(l,8));
  return {text:q.a+' '+q.op+' ? = '+q.ans,ans:q.b};
}
var FIVES=[0,5,10,15,20,25,30,35,40,45,50,55];
function fmt(h,m){return h+':'+(m<10?'0':'')+m;}
function clockQ(l){
  var h=ri(1,12),m=l===1?0:l===2?pick([0,30]):l===3?pick([0,15,30,45]):pick(FIVES);
  var ans=fmt(h,m),opts={};opts[ans]=1;
  while(Object.keys(opts).length<4){
    var h2=Math.random()<.5?h:ri(1,12);
    var m2=Math.random()<.5?m:(l===1?0:pick(FIVES));
    opts[fmt(h2,m2)]=1;
  }
  return {h:h,m:m,ans:ans,opts:shuffle(Object.keys(opts))};
}
function wordQ(p){

function confetti(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=['#ffd166','#7fe3ff','#ff8a3d','#a99bf0','#7ce3a1'];
  for(var i=0;i<n;i++){var e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(function(x){x.remove();}.bind(null,e),2200);}
}
function clockHtml(r){return '<div>'+clockSVG(r.q.h,r.q.m)+'</div>';}
function rPlay(){
  var r=S.round,p=S.p,q=r.quest,sk=p.skills[q],dots='';
  for(var i=0;i<r.total;i++)dots+='<i class="d'+(i<r.n?' on':i===r.n?' cur':'')+'"></i>';
  var h='<div class="top"><button class="btn ghost sm" data-act="home">‹ Home</button><div class="dots">'+dots+'</div><span class="pill">Challenge '+sk.lvl+(TOPICS[q]?' · '+TOPICS[q][sk.lvl-1]:'')+'</span></div>';
  h+='<div class="stage"><div class="'+r.anim+'">'+creature(p.type,stageOf(eff(p)),p.worn,140,'play')+'</div><div class="card qcard">';
  if(q==='math'||q==='miss'){
    h+='<div class="q">'+esc(r.q.text)+'</div>'+(r.q.note?'<div class="sub" style="color:#fff">'+esc(r.q.note)+'</div>':'')+'<div class="ansbox" id="ansbox">'+(r.cur||'&nbsp;')+'</div>';
    if(!r.fb)h+='<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button class="btn" data-act="key" data-v="'+n+'">'+n+'</button>';}).join('')+'<button class="btn ghost" data-act="key" data-v="back" aria-label="Delete">⌫</button><button class="btn" data-act="key" data-v="0">0</button><button class="btn" data-act="submit">Go</button>'+(q==='math'&&sk.lvl>=13?'<button class="btn ghost" data-act="key" data-v="-" aria-label="Minus sign">−</button><button class="btn ghost" data-act="key" data-v=".">.</button><button class="btn ghost" data-act="key" data-v="/">/</button>':'')+'</div>';
  }else if(q==='vocab'||q==='logic'){h+=mcHtml(r);}else if(q==='clock'){
    h+=clockHtml(r)+'<div class="sub" style="color:#fff">What time does the clock show?</div>';
    if(!r.fb)h+='<div class="opts">'+r.q.opts.map(function(o){return '<button class="btn" data-act="opt" data-v="'+o+'">'+o+'</button>';}).join('')+'</div>';
  }else{
    var w=r.word,mode=p.pref.spell;
    h+='<div class="row"><button class="btn" data-act="say">Hear the word</button><button class="btn ghost sm" data-act="peek">Peek</button><button class="btn ghost sm" data-act="hint">Hint</button></div>';
    var bl=w.split('').map(function(c,i){return (r.peek||r.fb)?c:(i===0&&r.hint?c:'_');}).join(' ');
    h+='<div class="blanks" aria-live="polite">'+bl+'</div>';
    if(!r.fb){
      h+='<div class="chips"><button class="chip'+(mode==='type'?' on':'')+'" data-act="mode" data-v="type">Type</button><button class="chip'+(mode==='tiles'?' on':'')+'" data-act="mode" data-v="tiles">Letter tiles</button></div>';
      if(mode==='type')h+='<input id="ans" value="'+esc(r.cur)+'" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Type the word"><button class="btn" data-act="submit">Check</button>';
      else{
        h+='<div class="slots">'+w.split('').map(function(c,i){var t=r.placed[i];return '<div class="slot">'+(t!==undefined?'<button class="tile" data-act="untile" data-v="'+i+'">'+r.tiles[t]+'</button>':'')+'</div>';}).join('')+'</div>';
        h+='<div class="slots">'+r.tiles.map(function(c,i){return '<button class="tile'+(r.placed.indexOf(i)>=0?' gone':'')+'" data-act="tile" data-v="'+i+'">'+c+'</button>';}).join('')+'</div>';
        h+='<button class="btn"'+(r.placed.length===w.length?'':' disabled')+' data-act="submit">Check</button>';
      }
    }
  }
  if(r.fb){
    var f=r.fb,msg;
    if(f.ok)msg='Yes! +'+f.gain+' XP';
    else if(q==='spell'){var t=f.typed.toLowerCase(),sh=r.word.split('').map(function(c,i){return t[i]===c?c:'<span class="bad">'+c+'</span>';}).join('');msg='Nearly! The word is<span class="big">'+sh+'</span>We will practise it again soon.';}
    else if(q==='vocab'||q==='logic')msg=mcWrong(r);
    else if(q==='clock')msg='Not quite. It was <b>'+r.q.ans+'</b>.';
    else msg='Not quite. The answer is <b>'+(r.q.disp!==undefined?r.q.disp:r.q.ans)+'</b>.';
    h+='<div class="fb '+(f.ok?'good':'oops')+'">'+msg+'</div>';
    r.fbEvents.forEach(function(e){h+='<div class="fb good">'+esc(e)+'</div>';});
    h+='<button class="btn" data-act="next">'+(r.n>=r.total?'See results':'Next')+'</button>';
  }
  h+='</div></div>';
  view(h,realmOf(eff(p)));
}
function rResults(){
  var r=S.round,p=S.p,st='';
  for(var i=0;i<r.total;i++)st+=star(i<r.correct);
  var h='<h1 class="title sm">Round complete!</h1><div class="card hero"><div class="stars">'+st+'</div><div class="who">'+r.correct+' of '+r.total+' right</div><div class="pill">+'+r.xp+' XP</div>'+(r.gems?'<div class="pill">'+GEM+'+'+r.gems+' gems</div>':'')+'<div class="pet">'+creature(p.type,stageOf(eff(p)),p.worn,150,'res')+'</div></div>';
  if(r.events.length)h+='<ul class="list">'+r.events.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul>';
  h+='<div class="row"><button class="btn" data-act="quest" data-v="'+r.quest+'">Play again</button><button class="btn ghost" data-act="home">Home</button></div>';
  view(h,realmOf(eff(p)));
}
function rColl(){
  var p=S.p;
  var h='<div class="top"><button class="btn ghost sm" data-act="home">‹ Home</button><span class="pill">'+GEM+p.gems+'</span></div><h1 class="title sm">'+esc(p.cname)+'’s collection</h1>';
  h+='<div class="hero"><div class="pet">'+creature(p.type,stageOf(eff(p)),p.worn,190,'coll')+'</div></div><div class="card"><b>Accessories</b>';
  Object.keys(ACC).forEach(function(k){
    var a=ACC[k],own=p.owned.indexOf(k)>=0,on=p.worn.indexOf(k)>=0;
    h+='<div class="shop"><span>'+a.n+'</span>'+(own?'<button class="btn sm '+(on?'ghost':'')+'" data-act="wear" data-v="'+k+'">'+(on?'Take off':'Wear')+'</button>':'<button class="btn sm"'+(p.gems>=a.cost?'':' disabled')+' data-act="buy" data-v="'+k+'">'+GEM+' '+a.cost+' Buy</button>')+'</div>';
  });
  h+='</div><div class="card"><b>Badges</b><div class="badges" style="margin-top:10px">'+BADGES.map(function(b){var on=p.badges.indexOf(b.id)>=0;return '<div class="badge'+(on?'':' off')+'"><b>'+b.n+'</b><span>'+b.d+'</span></div>';}).join('')+'</div></div>';
  h+=S.temp?'':(S.confirmDel?'<div class="card"><b>Delete '+esc(p.name)+' and all progress?</b><div class="row" style="margin-top:10px"><button class="btn ghost" data-act="delyes">Yes, delete</button><button class="btn" data-act="delno">Keep</button></div></div>':'<div class="row"><button class="btn ghost sm" data-act="del">Delete this explorer…</button></div>');
  view(h,realmOf(eff(p)));
}
/* ---------- battle arena screens ---------- */
function dangerOf(p,f){
  var d=f.lv-levelOf(eff(p));
  return d<=-2?['easy','Easy win']:d<=0?['even','Fair fight']:d<=2?['hard','Tough']:['no','Too strong for now'];
}
function rArena(){
  var p=S.p,L=levelOf(eff(p)),n=ABIL_NAMES[p.type];
  var h='<div class="top"><button class="btn ghost sm" data-act="home">‹ Home</button><span class="pill">'+GEM+p.gems+'</span></div>';
  h+='<h1 class="title sm">Battle Arena</h1><p class="sub">'+esc(p.cname)+'’s strength comes from its level. Keep learning to grow stronger.</p>';
  h+='<div class="card"><b>'+esc(p.cname)+'’s abilities</b><ul class="list" style="margin-top:8px">'+ABIL.map(function(a,i){
    return '<li'+(L>=a.lv?'':' style="opacity:.55"')+'>'+n[i]+' · '+a.desc+(L>=a.lv?'':' (Level '+a.lv+')')+'</li>';}).join('')+'</ul>';
  h+='<p class="sub" style="text-align:left">Elements: Tide beats Ember, Ember beats Gust, Gust beats Stone, Stone beats Tide. You are '+TYPES[p.type].name+'.</p></div>';
  h+='<div class="foes">'+FOES.map(function(f){
    var d=dangerOf(p,f),done=p.beaten.indexOf(f.id)>=0;
    return '<button class="card foe" data-act="foe" data-v="'+f.id+'">'+monster(f.el,f.t,110)+'<b>'+f.n+'</b><small>'+TYPES[f.el].name+' type · Level '+f.lv+'</small><span class="tag '+d[0]+'">'+d[1]+'</span>'+(done?'<span class="tag">Defeated</span>':'')+'</button>';
  }).join('')+'</div>';
  view(h,realmOf(eff(p)));
}
function finishBattle(){
  var b=S.B,p=S.p;if(b.done)return;b.done=true;b.newBadges=[];
  if(b.over==='win'){
    p.wins++;var first=p.beaten.indexOf(b.foe.id)<0,g=first?4+b.foe.t*2:1;
    p.gems+=g;if(first)p.beaten.push(b.foe.id);b.reward={g:g,first:first};
    BADGES.forEach(function(x){if(p.badges.indexOf(x.id)<0&&x.t(p)){p.badges.push(x.id);b.newBadges.push(x.n);}});
  }else p.losses++;
  save();
}
function pct(a,b){return Math.max(0,Math.round(a/b*100));}
function rBattle(){
  var b=S.B,p=S.p,f=b.foe,L=levelOf(eff(p)),h='';
  h+='<div class="top"><button class="btn ghost sm" data-act="arena">‹ Leave</button><span class="pill">Turn '+(b.turn+1)+'</span></div><div class="arena">';
  h+='<div class="side"><div class="'+(b.hitFoe?'shake':'')+'">'+monster(f.el,f.t,150)+'</div><b>'+f.n+' · Level '+f.lv+'</b><div class="hp foehp"><i style="width:'+pct(b.e,b.eMax)+'%"></i></div><small>'+b.e+' / '+b.eMax+' HP</small></div>';
  if(!b.over){
    if(b.charge)h+='<div class="warn">'+f.n+' is charging a SLAM! '+(L>=5?'Use '+ABIL_NAMES[p.type][1]+' to block it!':'Brace yourself!')+'</div>';
    else if(b.sinceCharge>=2)h+='<div class="warn">'+f.n+' is about to gather power...</div>';
  }
  h+='<div class="side"><div class="'+(b.hitMe?'shake':'')+'">'+creature(p.type,stageOf(eff(p)),p.worn,140,'bat')+'</div><b>'+esc(p.cname)+' · Level '+b.lvl+'</b><div class="hp"><i style="width:'+pct(b.h,b.hMax)+'%"></i></div><small>'+b.h+' / '+b.hMax+' HP'+(b.guard?' · Shield up':'')+'</small></div></div>';
  if(b.turnLog.length)h+='<div class="card" aria-live="polite">'+b.turnLog.map(function(t){return '<div>'+esc(t)+'</div>';}).join('')+'</div>';
  if(!b.over){
    var n=ABIL_NAMES[p.type];
    h+='<div class="abils">'+ABIL.filter(function(a){return b.lvl>=a.lv;}).map(function(a){
      var i=ABIL.indexOf(a),dis=(a.cd&&b.cd[a.id]>0)||(a.id==='mend'&&b.mend<=0);
      var sub=a.cd&&b.cd[a.id]>0?'Ready in '+b.cd[a.id]+' turn'+(b.cd[a.id]>1?'s':''):a.id==='mend'?b.mend+' left':a.desc;
      return '<button class="btn abil" data-act="abil" data-v="'+a.id+'"'+(dis?' disabled':'')+'>'+n[i]+'<small>'+sub+'</small></button>';
    }).join('')+'</div>';
    if(ABIL.some(function(a){return b.lvl<a.lv;}))h+='<p class="sub">More abilities unlock as you level up.</p>';
  }else if(b.over==='win'){
    h+='<div class="card hero"><div class="who">Victory!</div><div class="pill">'+GEM+'+'+b.reward.g+' gems'+(b.reward.first?' · first win':'')+'</div>'+(b.newBadges.length?'<div class="fb good">Badge earned: '+esc(b.newBadges.join(', '))+'</div>':'')+'<div class="row"><button class="btn" data-act="arena">Back to the Arena</button><button class="btn ghost" data-act="home">Home</button></div></div>';
  }else{
    h+='<div class="card hero"><div class="who">Not this time</div><p class="sub" style="text-align:center">'+f.n+' is Level '+f.lv+' and '+esc(p.cname)+' is Level '+b.lvl+'. '+(f.lv>b.lvl?'Complete some quests to level up, then try again!':'Try using Guard when it charges, and pick an element it is weak against.')+'</p><div class="row"><button class="btn" data-act="home">Train with quests</button><button class="btn ghost" data-act="arena">Arena</button></div></div>';
  }
  view(h,realmOf(eff(p)));
}
/* ---------- tap-to-answer questions (vocab and puzzles) ---------- */
function shapeSvg(tok,size){
  var p=tok.split(':'),k=p[0],c=p[1];
  var f='fill="'+c+'" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"';
  var s='<svg viewBox="0 0 40 40" width="'+size+'" height="'+size+'" role="img" aria-label="'+k+'">';
  if(k==='circle')s+='<circle cx="20" cy="20" r="15" '+f+'/>';
  else if(k==='square')s+='<rect x="6" y="6" width="28" height="28" rx="4" '+f+'/>';
  else if(k==='triangle')s+='<polygon points="20,5 36,34 4,34" '+f+'/>';
  else s+='<polygon points="20,3 25,15 38,16 28,25 31,38 20,31 9,38 12,25 2,16 15,15" '+f+'/>';
  return s+'</svg>';
}
function mcHtml(r){
  var q=r.q,h='';
  if(q.body){
    h+='<div class="passage">'+esc(q.body)+'</div>';
    if(q.read&&SPEECH&&!r.fb)h+='<button class="btn ghost sm" data-act="readq">Read it to me</button>';
  }
  if(q.seq)h+='<div class="seq">'+q.seq.map(function(t){return shapeSvg(t,56);}).join('')+'<div class="slotq">?</div></div>';
  if(q.nums)h+='<div class="q">'+esc(q.nums)+'</div>';
  h+='<div class="prompt">'+esc(q.prompt)+'</div>';
  if(!r.fb){
    var long=!q.shapes&&q.opts.some(function(o){return o.length>16;});
    h+='<div class="opts'+(q.shapes?'':' txt')+(long?' col1':'')+'">'+q.opts.map(function(o){
      return '<button class="btn" data-act="opt" data-v="'+esc(o)+'">'+(q.shapes?shapeSvg(o,44):esc(o))+'</button>';
    }).join('')+'</div>';
  }
  return h;
}
function mcWrong(r){
  var q=r.q;
  return 'Not quite. The answer is <b>'+(q.shapes?shapeSvg(q.ans,30):esc(q.ans))+'</b>. '+esc(q.why||'');
}
/* ---------- actions ---------- */
function openProfile(p,temp){
  S.p=p;S.temp=temp;S.confirmDel=false;
  if(!p.grp)p.grp={n:Math.round(p.xp/2),w:Math.round(p.xp/2)};if(!p.beaten)p.beaten=[];['vocab','logic'].forEach(function(k){if(!p.skills[k])p.skills[k]={lvl:(START[p.band]||START[2])[k],hist:[]};});p.wins=p.wins||0;p.losses=p.losses||0;
  var today=new Date().toLocaleDateString('en-CA'),yest=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
  if(p.last!==today){p.days=(p.last===yest)?p.days+1:1;p.last=today;}
  BADGES.forEach(function(b){if(p.badges.indexOf(b.id)<0&&b.t(p))p.badges.push(b.id);});
  save();S.screen='home';render();
}
function typeSubmit(){
  var r=S.round;syncInputs();var ok=r.cur.trim().toLowerCase()===r.word;if(r.cur.trim()==='')return;answer(ok);
}
var ACT={
  arena:function(){S.screen='arena';S.B=null;render();},
  foe:function(v){var f=FOES.filter(function(x){return x.id===v;})[0];S.B=newBattle(S.p,f);S.screen='battle';render();},
  abil:function(v){var b=S.B;if(!b||b.over)return;if(playerAct(b,v)===false)return;if(b.over)finishBattle();render();if(b.over==='win')confetti(40);},
  readq:function(){say(S.round.q.body);},
  picker:function(){S.screen='picker';S.p=null;S.temp=false;S.round=null;render();},
  open:function(v){openProfile(store.profiles[+v],false);},
  new:function(){S.form={name:'',cname:'',type:'ember',band:1};S.screen='new';render();},
  try:function(){openProfile(newProfile('Tester','ember','Sparky',2),true);},
  fage:function(v){syncInputs();S.form.band=+v;render();},
  ftype:function(v){syncInputs();S.form.type=v;render();},
  create:function(){
    syncInputs();var f=S.form,n=f.name.trim(),c=f.cname.trim();
    if(!n||!c){view('<div class="card">Please fill in both names first.</div><button class="btn" data-act="new">Back</button>',0);return;}
    var p=newProfile(n,f.type,c,f.band);store.profiles.push(p);S.temp=false;save();openProfile(p,false);
  },
  quest:function(v){startRound(v);},
  home:function(){S.round=null;S.screen='home';S.confirmDel=false;if(SPEECH)try{speechSynthesis.cancel();}catch(e){}render();},
  say:function(){speakWord();},
  peek:function(){showPeek(false);},
  hint:function(){S.round.hint=true;render();},
  mode:function(v){syncInputs();S.p.pref.spell=v;S.round.placed=[];save();render();var a=document.getElementById('ans');if(a)a.focus();},
  key:function(v){
    var r=S.round;if(r.fb)return;
    if(v==='back')r.cur=r.cur.slice(0,-1);
    else if(v==='-')r.cur=r.cur.charAt(0)==='-'?r.cur.slice(1):'-'+r.cur;
    else if(v==='.'||v==='/'){if(r.cur.indexOf('.')<0&&r.cur.indexOf('/')<0&&r.cur.replace('-','')!=='')r.cur+=v;}
    else if(r.cur.length<9)r.cur+=v;
    var b=document.getElementById('ansbox');if(b)b.innerHTML=r.cur||'&nbsp;';
  },
  submit:function(){
    var r=S.round;if(r.fb)return;
    if(r.quest==='spell'){
      if(S.p.pref.spell==='tiles'){if(r.placed.length!==r.word.length)return;r.cur=r.placed.map(function(i){return r.tiles[i];}).join('');answer(r.cur===r.word);}
      else typeSubmit();
    }else{if(r.cur==='')return;answer(close(parseAns(r.cur),r.q.ans));}
  },
  opt:function(v){var r=S.round;if(r.fb)return;answer(v===r.q.ans);},
  tile:function(v){var r=S.round;v=+v;if(r.placed.length<r.word.length&&r.placed.indexOf(v)<0){r.placed.push(v);render();}},
  untile:function(v){var r=S.round;r.placed.splice(+v,1);render();},
  next:function(){S.round.n>=S.round.total?finishRound():goNext();},
  coll:function(){S.screen='coll';render();},
  buy:function(k){var p=S.p,a=ACC[k];if(p.gems>=a.cost&&p.owned.indexOf(k)<0){p.gems-=a.cost;p.owned.push(k);p.worn.push(k);save();render();confetti(20);}},
  wear:function(k){var p=S.p,i=p.worn.indexOf(k);if(i>=0)p.worn.splice(i,1);else p.worn.push(k);save();render();},
  del:function(){S.confirmDel=true;render();},
  delno:function(){S.confirmDel=false;render();},
  delyes:function(){store.profiles=store.profiles.filter(function(x){return x!==S.p;});save();ACT.picker();},
  cheat:function(v){
    var p=S.p;if(!S.temp)return;
    if(v==='xp100')p.xp+=100;else if(v==='xp500')p.xp+=500;else if(v==='gems')p.gems+=10;
    else if(v==='balance'){p.grp.n=p.xp;p.grp.w=p.xp;}else if(v==='math4')p.skills.math.lvl=Math.min(MAXL.math,p.skills.math.lvl+4);
    else if(v==='skill')Object.keys(p.skills).forEach(function(k){p.skills[k].lvl=Math.min(MAXL[k],p.skills[k].lvl+1);});
    BADGES.forEach(function(b){if(p.badges.indexOf(b.id)<0&&b.t(p))p.badges.push(b.id);});render();
  }
};
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var f=ACT[b.dataset.act];if(f)f(b.dataset.v,b);});
/* Parent shortcut: press and hold the title for about two seconds to open test mode. */
(function(){
  var t=null;function clear(){if(t){clearTimeout(t);t=null;}}
  document.addEventListener('pointerdown',function(e){
    var el=e.target.closest&&e.target.closest('[data-hold]');if(!el)return;clear();
    t=setTimeout(function(){t=null;var f=ACT[el.dataset.hold];if(f)f();},2000);
  });
  ['pointerup','pointercancel','dragstart'].forEach(function(n){document.addEventListener(n,clear);});
  document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('[data-hold]'))e.preventDefault();});
})();
document.addEventListener('keydown',function(e){
  var r=S.round;if(S.screen!=='play'||!r||r.fb)return;
  if(e.target&&e.target.id==='ans'){if(e.key==='Enter'){e.preventDefault();typeSubmit();}return;}
  if(r.quest==='math'||r.quest==='miss'){
    if(/^[0-9.\/-]$/.test(e.key))ACT.key(e.key);else if(e.key==='Backspace')ACT.key('back');else if(e.key==='Enter')ACT.submit();
  }
});
if(SPEECH)try{speechSynthesis.getVoices();}catch(e){}
load();render();
</script>
